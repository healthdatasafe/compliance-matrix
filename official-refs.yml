# official-refs.yml — external-law citation -> official-text redirect map.
#
# INDIRECTION LAYER: documents (in compliance-internal and this matrix) link to
# a generated stub at /ref/<scope>/<slug>.html; the stub forwards to the official
# text below. When an official URL moves, edit it HERE and redeploy — every citing
# document is corrected at once, with no edit to the documents themselves.
#
# Keyed by <scope>.<ref>. `source` names where the URL points (swap centrally).
# Generated from the distinct citations in the HDS document set; law refs are public.
# HIPAA -> eCFR (official current 45 CFR). GDPR -> gdpr-info.eu (stable per-article
# reference; swap to EUR-Lex here if an official OJ link is preferred).

