id: hipaa-breach
title: HIPAA Breach Notification Rule
short: HIPAA-Breach
type: regulation
jurisdiction: US
version: 45 CFR Part 164 Subpart D (HITECH 2013 Omnibus Final Rule)
version_date: "2013-01-25"
canonical_url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-D
matrix_language: EN
layered_on_pryv: hipaa-breach
regions: [us]

family: hipaa

hds_posture:
  draft: true
  assessed_at: "2026-09-08"
  evidence_backing:
    rows_total: 13
    rows_evidenced: 12
    rows_approved: 12
    as_of: "2026-09-10"
  roles:
    - arrangement: vault
      role: not-applicable
      applies_to: >
        Every vault. The individual holds the account and decides who may see
        the data, so HDS holds it for them and never on a covered entity's
        behalf, whoever put it there and wherever it physically sits. A business
        associate is defined by acting on a covered entity's behalf, so HDS is
        not one here and HIPAA does not reach it.
  no_role_note: >
    Consent is not delegation. When an individual grants a clinician or an
    application access to their own vault, that access flows from their consent,
    not from anyone instructing HDS, so it creates no business associate
    relationship: not with the clinician, not with the application, and not with
    HDS. The data sitting on HDS infrastructure does not change on whose behalf
    it is held. Where an organisation would place protected health information
    with HDS on its OWN behalf, a BAA would be required; that arrangement is
    documented separately and is outside this matrix. The requirements below
    remain the map for an implementer that holds a HIPAA role of its own, and
    the FTC Health Breach Notification Rule and state consumer-health-data law
    are what reach the user-sovereign case instead.
  external_assurance:
    level: self-assessed
    detail: >
      No independent review. The incident and breach procedure has been
      rehearsed, not tested by a real reportable breach.
  statement: >
    HIPAA does not reach HDS in the vault, but the question this rule turns on is one
    the platform can answer: who was affected and what did they hold. The
    breach-scope primitive is deployed to every core with the access index
    backfilled, so the blast radius of a compromised token is enumerated rather than
    estimated, and twelve of the thirteen requirements are answered from approved
    documentation. The notification procedure is approved and rehearsed; no real
    reportable breach has exercised it.
  known_gaps:
    - summary: >
        No row in this scope has completed review, and the notification
        procedure has never run against a real incident.
      severity: medium
      internal_doc: procedures/security-incident-and-breach

changelog:
