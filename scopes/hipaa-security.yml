requirements:

- ref: 164.308(a)(1)(i)
  title: Security management process — standard
  text: |
    Implement policies and procedures to prevent, detect, contain, and correct
    security violations.
  pryv_ref: 164.308(a)(1)(i)
  draft: false
  hds:
    coverage: documented
    effort_saved: medium
    overview: |
      As an operator HDS runs its own security-management programme over the
      open-pryv.io platform, covering all four required specifications: risk
      analysis, risk management, sanction policy and information-system activity
      review. The umbrella programme is documented internally and made available
      on request; a partner running their own ePHI workload still maintains
      their own.
    detail: |
      HDS inherits the platform substrate (per-user audit log, system-level
      observability) that several specifications draw on, and wraps it in a
      written, maintained programme that is reviewed periodically. The
      programme rests on a risk analysis that has been conducted, rated,
      reviewed and approved, with a treatment register keyed to its findings,
      and on an approved sanction policy; the analysis and register are held
      internally and released on request. Only the activity-review specification
      carries its own row in this matrix, because it is the only one of the four
      with a platform contribution to describe; the other three are wholly
      organizational and are evidenced by the internal documents cited here. For
      a partner acting as Covered Entity or upstream BA, this is a programme
      they must run themselves; HDS supplies the technical raw material and its
      own programme as evidence of operator diligence.
    regions: [us, ch]
    evidence:
      internal_docs:
        - hipaa/policies/security-management-process
        - shared/registers/technology-stack
        - shared/registers/data-residency-regions
  implementer:
    - persona: covered-entity
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Define, document and maintain your own security-management programme;
        you may reference HDS's technical safeguards as inputs.
    - persona: business-associate
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Run your own security-management programme covering the ePHI you
        process, citing HDS substrate where it carries part of the control.
    - persona: individual
      coverage: out-of-scope

- ref: 164.308(a)(1)(ii)(A)
  title: Risk analysis — required implementation specification
  text: |
    Conduct an accurate and thorough assessment of the potential risks and
    vulnerabilities to the confidentiality, integrity, and availability of
    electronic protected health information held by the covered entity or
    business associate.
  draft: false
  hds:
    coverage: implemented
    effort_saved: low
    overview: |
      HDS has conducted its own risk analysis over the ePHI it holds as
      operator: an asset inventory covering every class in scope, a register of
      rated risks, and a documented method. It was reviewed and approved through
      the internal sign-off process. Each partner conducts its own analysis over
      its own workload; a risk analysis is not a thing one entity can perform on
      another's behalf.
    detail: |
      This specification is wholly organizational: no platform feature discharges
      it. What HDS contributes to a partner's own analysis is the control
      inventory in this matrix and the technology-stack register, which shorten
      the asset-identification step considerably; the assessment itself, its
      ratings and its conclusions remain the partner's. HDS's own analysis, its
      ratings and the specific weaknesses it names are confidential and released
      only on request under NDA, signed BAA or audit engagement, as is normal for
      a document whose contents are an inventory of what could go wrong.
    regions: [us, ch]
    evidence:
      internal_docs:
        - hipaa/risk/risk-analysis
  implementer:
    - persona: covered-entity
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Conduct and document your own risk analysis over the ePHI you hold; you
        may use this matrix and the HDS technology-stack register as inputs to
        asset identification, not as a substitute for the assessment.
    - persona: business-associate
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Conduct and document your own risk analysis over the ePHI you process. It is yours
        alone: the HDS analysis covers HDS's operator surface, not your workload.
    - persona: individual
      coverage: out-of-scope

- ref: 164.308(a)(1)(ii)(B)
  title: Risk management — required implementation specification
  text: |
    Implement security measures sufficient to reduce risks and vulnerabilities
    to a reasonable and appropriate level to comply with §164.306(a).
  draft: false
  hds:
    coverage: implemented
    effort_saved: low
    overview: |
      HDS maintains a risk-management plan whose treatment register is keyed to
      the identified risks, recording for each an owner, a treatment decision and
      a residual rating. It was reviewed and approved through the internal
      sign-off process. Treatment decisions are HDS's own; a partner runs the
      same cycle over its own analysis.
    detail: |
      Risk management is the disposition half of the risk-analysis cycle, and is
      as organizational as the analysis itself. The measures HDS selects are
      largely the controls documented across this matrix, which is why the
      matrix doubles as HDS's own control inventory. The register is complete
      against the analysis rather than a standing wish list: every identified
      risk carries a decision, including the decisions to accept. The register's
      contents, like the analysis, are confidential and released on request.
    regions: [us, ch]
    evidence:
      internal_docs:
        - hipaa/plans/risk-management
  implementer:
    - persona: covered-entity
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Select, implement and record treatments for the risks your own analysis
        identifies; the controls in this matrix are candidate measures, not a
        treatment decision made for you.
    - persona: business-associate
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Select, implement and record treatments for the risks your own analysis identifies, with
        residual risk accepted by someone who has the authority to accept it.
    - persona: individual
      coverage: out-of-scope

- ref: 164.308(a)(1)(ii)(D)
  title: Information system activity review — Required
  text: |
    Implement procedures to regularly review records of information system
    activity, such as audit logs, access reports, and security incident
    tracking reports.
  pryv_ref: 164.308(a)(1)(ii)(D)
  draft: true
  hds:
    coverage: implemented
    effort_saved: high
    overview: |
      On top of the platform's per-user audit log, HDS operates the review
      substrate: system-level activity is collected and monitored across both
      US and Switzerland data-residency options, with alerting on crash,
      error-rate and silence conditions. The platform telemetry channel is
      mid-transition (see the planned chip): the in-process vendor agent was
      removed 2026-07-28 in favour of an allow-list, aggregate-only emitter;
      until the self-hosted collector and rebuilt alert chain are verified,
      platform-core detection leans on synthetic and liveness checks. The
      written review cadence remains the implementer's responsibility.
    detail: |
      Per-API-call audit records (platform layer) plus infrastructure telemetry
      (HDS layer) together give both subject-level and system-level activity
      review. HDS operates the alerting chain end to end as a matter of policy
      before any component is treated as in production, so silent failures are
      caught. The documented review procedure HDS runs as operator is available
      on request.
    regions: [us, ch]
    evidence:
      internal_docs:
        - hipaa/procedures/information-system-activity-review
    planned:
      - kind: feature
        summary: >-
          Platform telemetry is moving from a vendor in-process agent (removed
          2026-07-28) to a self-hosted OTLP collector fed by the platform's
          allow-list aggregate emitter; collector deployment, alert-chain
          rebuild and end-to-end delivery verification are the tracked
          remainder.
        impact: medium
        internal_doc: hipaa/registers/subprocessor-register
        tracking_url: https://github.com/pryv/open-pryv.io/issues/60
  implementer:
    - persona: covered-entity
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Define and document your review cadence and who performs it, and retain
        the review records per your retention policy.
    - persona: business-associate
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Establish your own periodic review of activity records for the ePHI you
        process, drawing on the audit and monitoring substrate HDS exposes.
    - persona: individual
      coverage: out-of-scope

- ref: 164.308(a)(2)
  title: Assigned security responsibility — standard
  text: |
    Identify the security official who is responsible for developing and
    implementing the policies and procedures required by this subpart.
  pryv_ref: 164.308(a)(2)
  draft: false
  hds:
    coverage: implemented
    effort_saved: low
    overview: |
      HDS has designated its Security Official: appointed by the CEO on behalf
      of the HDS Foundation, effective 2026-07-15, recorded in the designated-
      roles register and the governing policy, both approved and disclosed on
      request. Each partner must designate their own official for their own
      programme.
    detail: |
      This is an organisational designation, not a software control. The
      designation is made and recorded as an operator artefact; the assigned
      official draws on the audit log, monitoring and this matrix as
      operational substrate. A distinct Privacy Official is designated
      separately (see hipaa-privacy §164.530(a)). A partner running ePHI on
      HDS names their own security official.
    regions: [us, ch]
    evidence:
      internal_docs:
        - hipaa/policies/assigned-security-responsibility
        - hipaa/registers/designated-roles
  implementer:
    - persona: covered-entity
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Designate and document your own security official.
    - persona: business-associate
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Designate and document your own security official.
    - persona: individual
      coverage: out-of-scope

- ref: 164.308(a)(3)(ii)(C)
  title: Termination procedures — Addressable
  text: |
    Implement procedures for terminating access to ePHI when employment ends or
    a workforce member's role changes.
  pryv_ref: 164.308(a)(3)(ii)(C)
  draft: true
  hds:
    coverage: implemented
    effort_saved: high
    overview: |
      Workforce access to ePHI is mediated by platform access tokens with
      granular per-stream permissions. Termination is a single revocation that
      takes effect immediately, and the audit log records the termination
      instant; role changes narrow permissions without losing the version
      history of the change.
    detail: |
      HDS operates the access-token model so that ending or changing a
      workforce member's access is an immediate, audited operation rather than
      a manual clean-up across systems. Full revocation removes the token;
      narrowing reduces permissions while preserving the access identity and its
      history. HDS documents the termination procedure it follows for its own
      workforce; partners apply the same primitives to their own staff.
    regions: [us, ch]
    evidence:
      internal_docs:
        - hipaa/procedures/access-termination
  implementer:
    - persona: covered-entity
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Document your termination workflow and tie it to revocation of the
        access tokens your workforce holds.
    - persona: business-associate
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Document your termination workflow for staff who handle the ePHI you
        process on HDS.
    - persona: individual
      coverage: out-of-scope

- ref: 164.308(a)(4)(ii)(B)
  title: Access authorization — Addressable
  text: |
    Implement policies and procedures for granting access to ePHI through a
    workstation, transaction, program, process, or other mechanism.
  pryv_ref: 164.308(a)(4)(ii)(B)
  draft: true
  hds:
    coverage: implemented
    effort_saved: high
    overview: |
      Granting access to ePHI on HDS means minting an access token with explicit
      per-stream permissions, enforced at every API call. The authorization
      rationale can travel alongside the grant itself, so the "why" stays with
      the "what".
    detail: |
      Access grants carry the streams and levels the grantee may exercise, plus
      free-form metadata such as workforce role, granting administrator and
      business reason. HDS operates this as the authoritative authorization
      mechanism for ePHI; there is no trust-based bypass path. HDS documents its
      own authorization policy and partners apply the same primitive.
    regions: [us, ch]
    evidence:
      internal_docs:
        - hipaa/policies/access-authorization
  implementer:
    - persona: covered-entity
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Document who may authorise access and on what basis, and capture the
        rationale alongside each grant.
    - persona: business-associate
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Document your authorization policy for access to the ePHI you process.
    - persona: individual
      coverage: out-of-scope

- ref: 164.308(a)(4)(ii)(C)
  title: Access establishment and modification — Addressable
  text: |
    Implement policies and procedures to establish, document, review, and modify
    a user's right of access, based on the entity's access authorization
    policies.
  pryv_ref: 164.308(a)(4)(ii)(C)
  draft: false
  hds:
    coverage: implemented
    effort_saved: high
    overview: |
      The access lifecycle (create, read, review, update, revoke) is first-class
      on the platform HDS operates. Every modification snapshots the prior
      version into history and is recorded in the audit log, giving the
      documented review trail this specification expects.
    detail: |
      HDS operates establishment, review and modification of access rights as
      audited operations: grants can be enumerated with their full version
      chain, narrowed or revoked, with each step timestamped and attributed to
      the acting administrator. HDS's own periodic operator access review is
      defined on a stated cadence and has been executed, so the cadence is
      exercised rather than merely written; the execution record is filed
      internally and is in review, not yet signed off. Partners apply the same
      primitives to their own populations. The review covers the operator
      accounts HDS administers, not the accesses that individual account holders
      grant over their own data: those are the account holder's to review and
      revoke, and HDS does not act on them.
    regions: [us, ch]
    evidence:
      internal_docs:
        - hipaa/procedures/access-review
  implementer:
    - persona: covered-entity
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Document your establishment-and-modification workflow and your periodic
        access-review cadence.
    - persona: business-associate
      basis: entity
      applies_when: always
      coverage: documented
      overview: |
        Document how you establish, review and modify access to the ePHI you
        process on HDS.
    - persona: individual
      coverage: out-of-scope

- ref: 164.308(a)(5)(ii)(A)
  title: Security reminders — Addressable
  text: |
    Implement periodic security updates and reminders for the workforce.
  pryv_ref: 164.308(a)(5)(ii)(A)
  draft: false
  hds:
    coverage: facilitated
    effort_saved: low
    facilitation_mode: awareness
    overview: |
      Security-reminder cadence and content are an organisational awareness
      control with no software role. HDS runs reminders for its own workforce
      and documents the programme; the artefact is available on request but
      training delivery itself is not yet formalised as a verified programme.
    detail: |
      HDS treats security reminders as part of its workforce-awareness
      programme, an operator artefact rather than a platform feature. The
      written programme is cited as an internal document. Formal,
      verified security-awareness training is a known gap being matured; each
      partner runs its own reminder programme for its own workforce.
    regions: [us, ch]
    evidence:
      internal_docs:
