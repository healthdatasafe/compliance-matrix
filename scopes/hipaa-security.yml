- ref: 164.308(a)(7)(ii)(A)
  title: Data backup plan — Required
  text: |
    Establish and implement procedures to create and maintain retrievable exact
    copies of ePHI.
  pryv_ref: 164.308(a)(7)(ii)(A)
  draft: false
  hds:
    coverage: facilitated
    effort_saved: high
    facilitation_mode: storage
    overview: |
      The platform produces per-user backup files (events, streams, accesses,
      attachments) with a matching restore path, so the backup unit matches the
      natural ePHI unit. HDS operates a backup schedule on top; automated,
      regularly verified backups are still being formalised, so this is
      facilitated rather than fully implemented.
    detail: |
      HDS runs the backup primitive on a schedule and documents the plan
      (frequency, location, encryption-at-rest applied at the storage boundary).
      The scheduled cycle produces encrypted, off-host, in-region copies on
      every regional core, and an archive has been retrieved and decrypted with
      the off-host key to demonstrate that the copies are usable rather than
      merely produced. What is not yet demonstrated is restore at production
      scale per region; that drill is the remaining gap. Partners
      operating their own deployments define their own schedule.
    regions: [us, ch]
    evidence:
      internal_docs:
        - hipaa/procedures/data-backup-plan
    planned:
      - kind: procedure
        summary: >-
          Automated, restore-verified backups are the tracked remediation.
          Provisioned and verified 2026-07-29: in-region off-host object
          storage in each region (Swiss and US) with object versioning; HDS-held
          hybrid encryption of every archive (a per-run AES-256-GCM key wrapped
          to a per-region RSA-4096 public key, the private key held off-host);
          least-privilege per-host access; and defined targets (RPO 24h, RTO 72h,
          retention a flat 30 days, the grandfather-father-son promotion having
          been retired 2026-09-02). The scheduled cycle is
          running on all regional cores as of 2026-07-30, and retrievability
          was demonstrated by fetching an archive off-host and decrypting it
          with the off-host private key. Outstanding before this is fully
          implemented: the per-region production restore drill at non-trivial
          scale, and confirmation of the storage lifecycle backstop.
        impact: medium
        internal_doc: hipaa/procedures/data-backup-plan
  implementer:
    - persona: covered-entity
      basis: integration
      applies_when: [stores-phi-copy]
      coverage: documented
      overview: |
        Document your backup schedule, storage location and retention, and
        confirm restorability.
    - persona: business-associate
      basis: integration
      applies_when: [stores-phi-copy]
