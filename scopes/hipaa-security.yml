id: hipaa-security
title: HIPAA Security Rule
short: HIPAA-Security
type: regulation
jurisdiction: US
version: 45 CFR Part 164 Subpart C (as amended through the HITECH 2013 Omnibus Final Rule)
version_date: "2013-01-25"
canonical_url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-C
matrix_language: EN
layered_on_pryv: hipaa-security
regions: [us]

family: hipaa

hds_posture:
  draft: true
  assessed_at: "2026-09-08"
  evidence_backing:
    rows_total: 43
    rows_evidenced: 43
    rows_approved: 43
    as_of: "2026-09-08"
  roles:
    - arrangement: covered-entity-relationship
      role: business-associate
      applies_to: >
        PHI a covered entity or another business associate places on the
        platform. HDS is the business associate under a signed BAA and carries
        the Security Rule obligations that flow to that role.
    - arrangement: vault
      role: not-applicable
      applies_to: >
        Services HDS operates directly for individuals and not on behalf of a
        covered entity. HIPAA attaches through the covered-entity relationship,
        so it does not reach this arrangement; the GDPR and the nLPD do. Confirm
        the characterisation of your own arrangement with counsel.
  external_assurance:
    level: self-assessed
    detail: >
      No HIPAA audit, no independent Security Rule assessment and no third-party
      report covers HDS. The attestations on file belong to the hosting
      providers and cover their facilities, not HDS's practices.
    inherited_provider_assurance:
      - AWS ISO/IEC 27001 (us-east-1 named in the certified locations), 27017, 27018 — obtained 2026-07-28
  statement: >
    Every one of the forty-three Security Rule requirements is answered from an
    approved HDS document. The administrative safeguards are live procedures,
    not paper: a risk analysis and risk-management plan are approved, workforce
    training runs against a completion register, backups are provisioned on both
    regional cores and a first restore rehearsal was executed on 2026-07-29.
    Nine requirements carry remediation HDS has committed to and not yet
    delivered; encryption at rest uses provider-managed keys, and customer-held
    or end-to-end keys are queued rather than shipped.
  known_gaps:
    - summary: >
        Addressable encryption at rest rests on provider-managed keys. Neither
        customer-managed keys nor end-to-end encryption is available, so a
        compromise of the hosting layer is not cryptographically contained.
      severity: high
      refs: ["164.312(a)(2)(iv)"]
    - summary: >
        Platform telemetry is mid-migration from a removed vendor agent to a
        self-hosted collector; the information-system activity review depends on
        that pipeline landing.
      severity: medium
      refs: ["164.308(a)(1)(ii)(D)"]
    - summary: >
        Nothing is on file evidencing the Swiss hosting region's physical and
        environmental controls, which is where the primary store sits. The
        safeguards inherited there are asserted by the provider, not evidenced
        by a third-party audit.
      severity: high
      refs: ["164.310(d)(1)"]
      internal_doc: hipaa/registers/hosting-provider-attestations

changelog:
  - date: "2026-09-08"
    change: >
      164.308(a)(5)(ii)(A): the training chip described the procedure and its
      record template as "drafted in the internal pipeline" with completion
      tracking outstanding. The procedure is approved, and the completion
      register holds dated third-party certifications for every workforce
      member with expiry reminders wired up. The chip now names the real
      remainder: the HDS-specific curriculum, recorded acknowledgements, and a
      first full cycle of the monthly cadence. draft cleared.
  - date: "2026-09-08"
    change: >
      164.308(a)(7)(ii)(A): the backup chip named "retention 7 daily / 4 weekly
      / 12 monthly". That grandfather-father-son schedule was retired on
      2026-09-02 in favour of a flat 30 days, and the figure was copied into
      the chip earlier the same day from a document that had not caught up. It
      now reads flat 30 days. The consequence is not cosmetic: retention
      cycling is the erasure-propagation bound, so the old figure overstated by
      twelve times how long an erased account survives in backups.
  - date: "2026-09-08"
    change: >
      Corrects the entry above it, which recorded four edits that a failed
      script never wrote to the file: the 164.312(b) citation removal, the
      164.308(a)(7)(ii)(A) backup chip and detail, and the 164.308(a)(7)(ii)(D)
      chip. All four are now applied and verified by reading the parsed file
      back. Separately: shared/registers/data-residency-regions cited on
      164.308(a)(1)(i), the requirement it declares under refs_satisfy, and
      count-bound residency phrasing ("both regions", "both cores", "both
      data-residency options") replaced with number-agnostic wording throughout
      the requirements, so a third region cannot make the prose false. The
      changelog is left as written: it is history. Applies compliance-internal
      instruction 2026-08-26-security-and-soc2-approvals, items 1 and 2.
  - date: "2026-09-08"
    change: >
      164.312(b): hipaa/procedures/information-system-activity-review removed
      from the evidence citations. That document released the code on
      2026-07-30 and now declares it under refs_relate; hipaa/policies/audit-controls
      owns it and was already cited. Fourth row of this class found in this
