id: swiss-nlpd
title: Swiss Federal Act on Data Protection (revised FADP / nLPD)
short: Swiss nLPD
type: regulation
jurisdiction: Switzerland (extraterritorial via Art. 3 for processing affecting CH)
version: SR 235.1 (revFADP / nLPD, in force 2023-09-01)
version_date: "2023-09-01"
canonical_url: https://www.fedlex.admin.ch/eli/cc/2022/491/en
matrix_language: EN
layered_on_pryv: swiss-nlpd
regions: [ch]

hds_posture:
  draft: true
  assessed_at: "2026-09-08"
  evidence_backing:
    rows_total: 30
    rows_evidenced: 24
    rows_approved: 11
    as_of: "2026-09-10"
  roles:
    - arrangement: vault
      role: controller
      applies_to: >
        The individual's vault. HDS determines the purposes and means of
        operating it, so HDS is the controller under the Act. Data enters only with
        the individual's explicit consent, and the individual decides who may
        access it afterwards.
  no_role_note: >
    HDS is not an processor for this product, and the matrix does not
    offer that arrangement. Acting as a processor would require processing on a
    controller's instructions and returning or deleting the data at its choice. HDS acts on the
    individual's permissions, the individual exercises their rights directly
    from their own dashboard, and HDS cannot delete an individual's vault at a
    third party's direction. An organisation that receives data an individual
    chose to share with it is an independent controller of what it holds, not a
    controller instructing HDS. Any future engagement in which HDS genuinely
    does process on instructions falls outside this matrix and carries its own
    documentation.
  external_assurance:
    level: self-assessed
    detail: >
      No FDPIC review, no certification under Art.13 nLPD and no independent
      audit has been performed. This is HDS's own assessment. Nothing is on
      file for the Swiss hosting region either: the physical safeguards HDS
      inherits there are asserted by the provider, not evidenced by a
      third-party audit.
  statement: >
    Swiss residency is the strongest part of this position: the ch region runs
    on Swiss infrastructure and the data does not leave it, which is what most
    of this Act's residency and transfer concern is about. Thirteen of the
    thirty requirements rest on approved documentation and eleven more are
    evidenced by documents in review, the same pipeline as the GDPR. Six
    articles are recorded as out of scope because they address federal bodies
    or obligations that attach only to the controller, marked on the rows
    themselves rather than omitted.
  known_gaps:
    - summary: >
        Nothing is on file evidencing the Swiss hosting region's physical and
        environmental controls. The safeguards HDS inherits there are asserted
        by the provider rather than evidenced by a third-party audit, and the
        provider's public encryption statement is a product claim, not an
        attestation.
      severity: high
      internal_doc: hipaa/registers/hosting-provider-attestations
    - summary: >
        The processor-side register lacks retention periods on the recruitment,
        CRM and contact-mailbox activities, the same gap as the GDPR Art.30 row.
      severity: medium
      refs: ["Art.12"]
    - summary: >
        Only one of the thirty rows has completed review. The rest are drafts
        that state HDS's position but have not been checked by a second reader.
      severity: medium
      internal_doc: gdpr/registers/records-of-processing

