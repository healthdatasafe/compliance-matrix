# profiles.yml — the implementer-profile vocabulary.
#
# Rows reference these ids from `implementer[].applies_when`. validate.js
# rejects unknown ids and warns about a feature no row uses, because a checkbox
# that changes nothing is worse than no checkbox.
#
# THE INVARIANT THIS FILE EXISTS TO PROTECT: an obligation may be hidden ONLY
# when it carries an explicit `applies_when` list and every listed feature is
# off. An obligation with no `applies_when` is ALWAYS shown, marked "not yet
# profiled". Silence about an obligation is the one failure that actually harms
# an implementer, so untagged never means inapplicable.

version: 1

# ---------------------------------------------------------------------------
# Features: what the implementer tells us about what they are building.
# ---------------------------------------------------------------------------
features:

  # --- Step 1. Where your users are. Nothing works until this is answered. ---
  - id: subjects-eu
    group: population
    label: In the EU or EEA
  - id: subjects-ch
    group: population
    label: In Switzerland
  - id: subjects-us
    group: population
    label: In the United States

  # --- Step 1b. Only meaningful when US users are involved. One question, four
  # answers, because the three HIPAA facts form a hierarchy: being a covered
  # entity implies one is involved. Asking them as three checkboxes let a reader
  # tick a combination that means nothing. ---
  - id: us-role-none
    group: us-role
    exclusive: us-role
    label: No US healthcare provider, health plan or clearinghouse is involved
  - id: us-role-ce-involved
    group: us-role
    exclusive: us-role
    label: One is involved, but not through you (your user's own doctor, say)
  - id: us-role-acts-for
    group: us-role
    exclusive: us-role
    label: You build or run this application for one, or under contract to one
  - id: us-role-you-are
    group: us-role
    exclusive: us-role
    label: You are one

  # --- Step 2. What reaches your systems. ---
  - id: connects
    group: application
    label: Data from your users' vaults reaches your systems
    note: >
      They share it with you, or they sign in to your application with their HDS
      account. Either way you hold personal data.
  - id: stores-phi-copy
    group: application
    label: You keep your own copy of health data, including backups and exports
  - id: own-records
    group: application
    label: You keep your own user records outside HDS
    note: >
      Accounts, email addresses, crash reports, usage analytics. None of this
      touches the vault, and all of it is personal data you control.
  - id: third-parties
    group: application
    label: Other companies touch the data
    note: >
      Your cloud host, your email or analytics vendors, partners you pass data
      to. Hosting counts.
  - id: analytics
    group: application
    label: You compute on the data
    note: >
      Reports, scores, alerts, AI or machine learning, whether the output is
      aggregated or about one person.
  - id: secondary-use
    group: application
    label: You use the data for your own ends
    note: >
      Research, product improvement, marketing, or selling it: anything beyond
      the service the user signed up for.

  # --- Step 3. Hosting. ---
  - id: region-ch
    group: residency
    exclusive: region
    label: Switzerland
  - id: region-us
    group: residency
    exclusive: region
    label: United States

  - id: want-soc2
    group: population
    label: Your customers ask you for SOC 2 assurance

derived:
  # Do you process personal data AT ALL? If an app only lets its own user work on
  # their own vault, and the developer receives nothing, the developer is neither
  # controller nor processor: they supply a tool. Almost every duty is gated on
  # this, so ticking nothing correctly yields almost nothing.
  - id: processes-personal-data
    any: [connects, stores-phi-copy, own-records, third-parties, analytics, secondary-use]
    label: You process personal data of your own

  # The HIPAA half: 45 CFR 160.103 needs BOTH acting for a covered entity AND
  # handling protected health information.
  - id: handles-user-data
    any: [connects, stores-phi-copy, third-parties, analytics]
    label: User data reaches your systems

  - id: hipaa-in-play
    any: [us-role-ce-involved, us-role-acts-for, us-role-you-are]
    label: A covered entity is somewhere in the picture

  - id: transfer-eu-us
    all: [subjects-eu, region-us]
    label: Personal data leaving the EU or EEA for the US region
  - id: transfer-eu-ch
    all: [subjects-eu, region-ch]
    label: Personal data leaving the EU or EEA for Switzerland
  - id: transfer-ch-us
    all: [subjects-ch, region-us]
    label: Personal data leaving Switzerland for the US region

# Presets: the four archetypes. `locked` lists what the archetype settles, on or
# off; anything else stays free, because it describes your organisation rather
# than the thing you are building.
presets:
  - id: self-monitoring
    label: Self-monitoring app
    summary: >
      Your application serves the end user only. Nothing reaches you, so almost
      nothing lands on you.
    features: []
    locked: [connects, stores-phi-copy, analytics, secondary-use]
  - id: shared-with-you
    label: Users share data with you
    summary: >
      They share from their vault, or sign in with their HDS account. You still
      keep no copy of your own.
    features: [connects]
    locked: [connects, stores-phi-copy, analytics]
  - id: aggregate-ai
    label: Plus reports or AI
    summary: >
      As above, plus reports, scores or models computed on the data. Still no
      copy kept outside HDS.
    features: [connects, analytics]
    locked: [connects, analytics, stores-phi-copy]
  - id: stores-copy
    label: You keep your own copy
    summary: >
      You hold health data on your own systems. That makes you an INDEPENDENT
      controller of that copy, with your own lawful basis, notice and security
      duties. It does not make HDS your processor.
    features: [connects, stores-phi-copy]
    locked: [connects, stores-phi-copy]

# Step 2: independent toggles, any combination. Jurisdictions are genuinely
# additive (serve the EU, Switzerland and the US at once), so exclusive cards
# were the wrong shape. Switzerland stays its own toggle rather than folding
# into Europe: the nLPD is a separate framework and a Swiss-only service is not
# automatically in GDPR scope.
step2:
  - id: eu
    feature: subjects-eu
    label: Users in the EU or EEA
    hint: The GDPR applies.
  - id: ch
    feature: subjects-ch
    label: Users in Switzerland
    hint: The Swiss nLPD applies.
  - id: us
    feature: subjects-us
    label: Users in the United States
    hint: >
      The FTC Health Breach Notification Rule and state consumer-health-data
      law. HIPAA only where a healthcare provider is involved.
  - id: us-health
    feature: us-role-acts-for
    label: You act for, or are, a US healthcare provider, health plan or clearinghouse
    hint: HIPAA applies to you. Implies users in the United States.
    implies: [subjects-us]
    clears: [us-role-none]
    choice:
      legend: Which one?
      options:
        - feature: us-role-acts-for
          label: You build for one, or under contract to one
        - feature: us-role-you-are
          label: You are one

scope_applicability:
  - scope: gdpr
    when: { any: [subjects-eu] }
  - scope: swiss-nlpd
    when: { any: [subjects-ch] }
  - scope: hipaa-security
    when: { all: [subjects-us, hipaa-in-play] }
  - scope: hipaa-privacy
    when: { all: [subjects-us, hipaa-in-play] }
  - scope: hipaa-breach
    when: { all: [subjects-us, hipaa-in-play] }
  - scope: soc2
    when: { any: [want-soc2] }

uncovered:
  - id: us-consumer
    when: { all: [subjects-us] }
    unless: [us-role-you-are, us-role-acts-for]
    title: US consumer health data, with no HIPAA role on your side
    message: >
      HIPAA does not reach you here: you neither are a covered entity nor act
      for one. The FTC Health Breach Notification Rule and state
      consumer-health-data laws do apply. This matrix has no scope for either
      yet, so the requirements below are not the whole of your obligations.
      Take this one to counsel.

personas:
  gdpr: { default: controller }
  swiss-nlpd: { default: controller }
  hipaa-security: &hipaa-role
    derive:
      - persona: covered-entity
        when: { any: [us-role-you-are] }
      - persona: business-associate
        when: { all: [us-role-acts-for, handles-user-data] }
  hipaa-privacy: *hipaa-role
  hipaa-breach: *hipaa-role
  soc2: { default: service-organization }

# ---------------------------------------------------------------------------
# SCOPE: the vault product.
#
# Individuals hold their own HDS accounts, data enters only with their explicit
# consent, and they decide who may access it. HDS is therefore the controller of
# the vault, and is NOT an Art.28 processor for anyone: it acts on the
# individual's permissions, not on an organisation's instructions, and cannot
# delete or return an individual's data at a third party's direction.
#
# An organisation that receives data an individual chose to share is an
# INDEPENDENT controller of what it then holds. It needs its own lawful basis,
# its own notice and its own security measures. It does not need, and cannot
# have, a DPA with HDS for the vault.
#
# HIPAA is different and the business-associate role stands: that test turns on
# maintaining PHI where a Covered Entity is party to the relationship, not on
# processing under instructions (hipaa/registers/hipaa-scope, approved
# 2026-08-26).
#
# Known limitation: only the rows the four archetypes touch are tagged so far.
# Everything untagged shows unfiltered, marked "not yet profiled".
# ---------------------------------------------------------------------------
